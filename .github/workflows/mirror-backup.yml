name: Mirror Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Esto evita que GitHub inyecte las credenciales del bot
          persist-credentials: false

      - name: Fetch all branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in $(git branch -r | grep -v '\->' | sed 's/origin\///'); do
            git branch --track "$branch" "origin/$branch" 2>/dev/null || true
          done

      - name: Set up backup remote
        run: |
          git remote add backup https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/${{ secrets.BACKUP_REPO }}.git

      - name: Mirror current state (branches only, keeps snapshot tags)
        run: git push backup --all --force

      - name: Create dated snapshot tag (never overwritten)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d-%Hh%Mm)
          git tag -a "backup-$TIMESTAMP" -m "Backup snapshot $TIMESTAMP (Argentina time)"
          git push backup "backup-$TIMESTAMP"