<!-- sign-up.html -->
<div class="wrapper">
@if(screenWidth >= 1024){

  <div class="ALERT-CONTAINER">
    <h2 class="ALERT-MESSAGE">
      ESTAS FUERA DE LA COBERTURA DEL MOBILE DESIGN
    </h2>
  </div>

} @else {

  <div class="signup-page">

    <div class="top-bar">
      <span class="back-arrow" (click)="goToLogin()">
        ←
      </span>
    </div>

    <div class="content">

      <div class="title-section">
        <h1>Registrarse</h1>
      </div>

      <div class="form-section">

        <div class="input-group">
          <label>Ingresa tu nombre completo</label>

          <input
            type="text"
            placeholder="Nombre completo"
            [(ngModel)]="fullName"
          />
        </div>

        <div class="input-group">
          <label>Ingresa tu número</label>

          <input
            type="text"
            placeholder="Número de celular"
            [(ngModel)]="phoneNumber"
          />
        </div>

        <div class="input-group">
          <label>Ingresa tu DNI</label>

          <input
            type="text"
            placeholder="Documento Nacional de Identidad"
            [(ngModel)]="dni"
          />
        </div>

        <div class="input-group">
          <label>Ingresa tu email</label>

          <input
            type="email"
            placeholder="nombre@email.com"
            [(ngModel)]="email"
          />
        </div>

        <div class="input-group">
          <label>Ingresa tu contraseña</label>

          <input
            type="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
          />
        </div>

        <div class="input-group">
          <label>Confirma tu contraseña</label>

          <input
            type="password"
            placeholder="Vuelva a poner su contraseña"
            [(ngModel)]="confirmPassword"
          />
        </div>

        <div class="terms-check">

          <input
            type="checkbox"
            [(ngModel)]="acceptedTerms"
          />

          <span>Términos y condiciones</span>

        </div>

      </div>
      <button class="continue-btn" (click)="continue()">
        Continuar
      </button>
    </div>
  </div>
}
</div>
