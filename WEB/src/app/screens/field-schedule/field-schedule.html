<div class="page">

  <app-header></app-header>

  <div class="content">

    <img
      src="/cancha1.png"
      alt="Cancha"
      class="field-image"
    />

    <div class="field-card">

      <h2>Cancha 1 - Fútbol 5</h2>

      <p class="subtitle">
        Techada · Césped sintético
      </p>

      <div class="info-container">

        <div class="info-box">
          <span class="label">tipo</span>
          <span>Techada</span>
        </div>

        <div class="info-box">
          <span class="label">precio</span>
          <span>$8.000/h</span>
        </div>

        <div class="info-box">
          <span class="label">horario</span>
          <span>08:00 - 23:00</span>
        </div>

      </div>

      <div class="date-section">

        <label>Elegí tu turno:</label>

        <div class="date-selector">

          @for(date of visibleDates; track date.value){

            <button
              class="date-pill"
              [class.selected-date]="selectedDate.toDateString() === date.value.toDateString()"
              (click)="selectDate(date.value)">

              <div class="date-calendar">

          <span class="month">
            {{ date.month }}
          </span>

                <span class="day">
            {{ date.day }}
          </span>

              </div>

              <span class="availability">
          {{ date.availableSlots }} libres
        </span>

            </button>

          }

          <button
            class="calendar-pill"
            (click)="calendarInput.showPicker()">

            📅

          </button>

          <input
            #calendarInput
            hidden
            type="date"
            (change)="onDateChange($event)"
          />

        </div>

      </div>

      <div class="hours-grid">

        @for(slot of timeSlots; track slot.hour){

          <button
            class="hour-btn"
            [class.selected]="selectedHour === slot.hour"
            [class.unavailable]="!slot.available"
            (click)="selectHour(slot.hour)"
          >

            {{slot.hour}}

          </button>

        }

      </div>

      <div class="legend">

        <div>
          <span class="dot unavailable-dot"></span>
          No disponible
        </div>

        <div>
          <span class="dot selected-dot"></span>
          Seleccionado
        </div>

        <div>
          <span class="dot available-dot"></span>
          Disponible
        </div>

      </div>

      <button
        class="reserve-btn"
        (click)="reserve()"
      >
        RESERVAR TURNO
      </button>

    </div>

  </div>

  <app-bottom-navbar></app-bottom-navbar>

</div>
