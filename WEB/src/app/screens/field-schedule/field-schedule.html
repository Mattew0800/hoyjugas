  <app-header></app-header>

  <section class="schedule-layout">

    <!-- 1. Stepper -->
    <div class="step-header">
      <div class="stepper-row">
        <div class="step active">1</div>
        <div class="line active"></div>
        <div class="step">2</div>
        <div class="line"></div>
        <div class="step">3</div>
      </div>
      <p class="step-title">Paso 1 de 3: Selección de Fecha</p>
    </div>

    <!-- 2. Field summary -->
    <article class="field-card">
      <p class="field-title">Cancha 1 • Fútbol 5</p>
    </article>

    <!-- 3. Date grid -->
    <div class="date-grid">

      @for (date of dates; track date.day) {
        <div
          class="date-card"
          [class.active]="date === selectedDate"
          [class.disabled]="date.slots === null"
          (click)="selectDate(date)">
          <span class="date-month">{{ date.label }}</span>
          <span class="date-number">{{ date.day }}</span>
          <span class="date-status">
            {{ date.slots === null ? 'Agotado' : date.slots + ' libres' }}
          </span>
        </div>
      }

      <!-- Ver más → abre el modal de calendario -->
      <div class="date-card more-btn" (click)="openModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CEA764" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="more-text">VER MÁS</span>
      </div>

      @if (isModalOpen) {
        <app-select-date-modal
          [isClosing]="isClosing"
          (onClose)="closeModal()"
          (onConfirm)="handleDateConfirmed($event)">
        </app-select-date-modal>
      }
    </div>

    <!-- 4. CTA -->
    <div class="fixed-bottom-action">
      <button
        class="btn-primary"
        [disabled]="!selectedDate"
        (click)="goToTimeSelection()">
        Continuar
      </button>
    </div>

  </section>

  @if(!isModalOpen){
    <app-bottom-navbar></app-bottom-navbar>
  }
