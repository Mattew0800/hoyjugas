  <app-header></app-header>

  <section class="schedule-layout">

    <!-- 1. Stepper -->
    <div class="step-header">
      <div class="stepper-row">
        <div class="step active">1</div>
        <div class="line active"></div>
        <div class="step">2</div>
        <div class="line"></div>
        <div class="step">3</div>
      </div>
      <p class="step-title">Paso 1 de 3: Selección de Fecha</p>
    </div>



    <!-- 2.  -->
    <article class="field-card">
      <p class="field-title">Cancha 1 • Fútbol 5</p>
    </article>

    <!-- 3.  -->
    <div class="date-grid">
      <div class="date-card active">
        <span class="date-month">HOY</span>
        <span class="date-number">15</span>
        <span class="date-status">2 libres</span>
      </div>

      <div class="date-card">
        <span class="date-month">AGO</span>
        <span class="date-number">16</span>
        <span class="date-status">6 libres</span>
      </div>

      <div class="date-card disabled">
        <span class="date-month">AGO</span>
        <span class="date-number">17</span>
        <span class="date-status">Agotado</span>
      </div>

      <div class="date-card">
        <span class="date-month">AGO</span>
        <span class="date-number">18</span>
        <span class="date-status">8 libres</span>
      </div>

      <div class="date-card">
        <span class="date-month">AGO</span>
        <span class="date-number">19</span>
        <span class="date-status">7 libres</span>
      </div>

      <div class="date-card">
        <span class="date-month">AGO</span>
        <span class="date-number">20</span>
        <span class="date-status">8 libres</span>
      </div>

      <div class="date-card">
        <span class="date-month">AGO</span>
        <span class="date-number">21</span>
        <span class="date-status">8 libres</span>
      </div>

      <div class="date-card more-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CEA764" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="more-text">VER MÁS</span>
      </div>
    </div>

    <!-- 4.CTA -->
    <div class="fixed-bottom-action">
      <button class="btn-primary" routerLink="/field-schedule/date-selection">Continuar</button>
    </div>


  </section>


  <app-bottom-navbar></app-bottom-navbar>
