<aside class="internal-sidebar">

  <div>

    <div class="logo-container">

      <img
        src="/AZTK%20ARENA.svg"
        alt="AZTK Arena"
        class="logo">

    </div>

    <nav class="menu">

      <div
        *ngFor="let item of menuItems"
        class="menu-item-wrapper">

        <button
          class="menu-item"
          [class.active]="item.active"
          (click)="navigate(item)">

          <img
            [src]="item.icon"
            [alt]="item.label">

          <span>
        {{ item.label }}
      </span>

        </button>

        @if (item.hasSubmenu && showManagementMenu) {

          <div class="management-submenu">

            <button
              class="submenu-item"
              (click)="goToSpaces()">
              Espacios
            </button>

            <button
              class="submenu-item"
              (click)="goToEmployees()">
              Empleados
            </button>

          </div>

        }

      </div>

    </nav>

  </div>

  <button
    class="logout-button"
    (click)="logout()">

    <img
      src="/assets/emojis/logout.svg"
      alt="Cerrar sesión">

    <span>
      Cerrar sesión
    </span>

  </button>

</aside>
