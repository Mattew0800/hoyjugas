<div class="space-column">

  <div class="column-header">

    <h3>

      {{ space.name }}

    </h3>

    <span>

      {{ space.type }}

    </span>

  </div>

  <div class="column-body">

    @for(slot of space.slots; track slot.id){

      <app-space-slot
        [slot]="slot">
      </app-space-slot>

    }

  </div>

</div>
