<app-header></app-header>

<div class="password-container">

  <button
    class="back-button"
    (click)="goBack()">

    ‹ Volver a Mi Perfil

  </button>

  <h1 class="title">
    Modificar Contraseña
  </h1>

  <p class="description">
    Para proteger tu cuenta, asegurate de elegir una clave segura.
  </p>

  <div class="password-card">

    <div class="field-group">

      <label>
        CONTRASEÑA ACTUAL
      </label>

      <div class="input-wrapper">

        <input
          [type]="hideCurrentPassword ? 'password' : 'text'"
          [(ngModel)]="currentPassword"
        >

        <button
          type="button"
          class="eye-button"
          (click)="hideCurrentPassword = !hideCurrentPassword">

          👁

        </button>

      </div>

    </div>

    <div class="field-group">

      <label>
        NUEVA CONTRASEÑA
      </label>

      <div class="input-wrapper">

        <input
          [type]="hideNewPassword ? 'password' : 'text'"
          placeholder="Ingresá la nueva clave"
          [(ngModel)]="newPassword"
        >

        <button
          type="button"
          class="eye-button"
          (click)="hideNewPassword = !hideNewPassword">

          👁

        </button>

      </div>

    </div>

    <div class="field-group">

      <label>
        CONFIRMAR NUEVA CONTRASEÑA
      </label>

      <div class="input-wrapper">

        <input
          [type]="hideConfirmPassword ? 'password' : 'text'"
          placeholder="Repetí la nueva clave"
          [(ngModel)]="confirmPassword"
        >

        <button
          type="button"
          class="eye-button"
          (click)="hideConfirmPassword = !hideConfirmPassword">

          👁

        </button>

      </div>

    </div>

  </div>

  <div class="password-rules">

    <div
      class="rule"
      [class.valid]="hasMinLength"
      [class.invalid]="newPassword.length > 0 && !hasMinLength">

      ✓ Mínimo 8 caracteres.

    </div>

    <div
      class="rule"
      [class.valid]="hasNumberOrSpecial"
      [class.invalid]="newPassword.length > 0 && !hasNumberOrSpecial">

      • Debe incluir un número o carácter especial.

    </div>

    <div
      class="rule"
      [class.valid]="passwordsMatch"
      [class.invalid]="confirmPassword.length > 0 && !passwordsMatch">

      • Las contraseñas deben coincidir.

    </div>

  </div>

  <button
    class="update-button"
    (click)="updatePassword()">

    ACTUALIZAR CONTRASEÑA

  </button>

</div>

<app-bottom-navbar></app-bottom-navbar>
