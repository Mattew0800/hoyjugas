<app-header></app-header>

<section class="schedule-layout">
  <!-- 1. Stepper -->
  <div class="step-header">
    <div class="stepper-row">
      <div class="step completed">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="line active"></div>
      <div class="step completed">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="line active"></div>
      <div class="step active">3</div>
    </div>
    <p class="step-title">Paso 3 de 3: Método de pago</p>
  </div>

  <!-- 2. Selected Field Summary Card (Actualizada con horario) -->
  <article class="selected-field-card">
    <div class="field-info-left">
      <div class="field-thumb"></div>
      <div class="field-text">
        <h3 class="field-name">Cancha 1 • Fútbol 5</h3>
        <p class="field-date">Sábado 15 de Agosto · 17:00 hs</p>
      </div>
    </div>
    <button class="change-btn">Cambiar</button>
  </article>

  <!-- 3. Payment Options Section -->
  <div class="payment-section">
    <h2 class="section-label">Monto a pagar</h2>

    <div class="payment-card active">
      <div class="radio-info">
        <div class="custom-radio"></div>
        <div class="payment-texts">
          <span class="payment-title">Pagar Total (100%)</span>
          <span class="payment-desc">Turno abonado por completo</span>
        </div>
      </div>
      <span class="payment-price">$20.000</span>
    </div>

    <div class="payment-card">
      <div class="radio-info">
        <div class="custom-radio"></div>
        <div class="payment-texts">
          <span class="payment-title">Pagar Seña (50%)</span>
          <span class="payment-desc">Resto del pago en el complejo</span>
        </div>
      </div>
      <span class="payment-price">$10.000</span>
    </div>
  </div>

  <!-- 4. Security Notice & Bottom CTA -->
  <div class="fixed-bottom-action">
    <div class="security-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span>Pago seguro procesado por Mercado Pago</span>
    </div>
    <button class="btn-primary" (click)="goToSuccess()">Pagar $20.000</button>
  </div>
</section>

<app-bottom-navbar></app-bottom-navbar>
